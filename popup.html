<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Fake Form Filler</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    width: 260px;
    padding: 16px;
    margin: 0;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .header img {
    width: 24px;
    height: 24px;
  }
  h1 {
    font-size: 14px;
    margin: 0;
    color: #1a1a1a;
  }
  button {
    width: 100%;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #93c5fd; cursor: default; }
  #status {
    margin-top: 10px;
    font-size: 12px;
    color: #444;
    min-height: 16px;
  }
  .hint {
    margin-top: 10px;
    font-size: 11px;
    color: #888;
    line-height: 1.4;
  }
  .settings {
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px solid #eee;
  }
  .settings label {
    display: block;
    font-size: 11px;
    color: #555;
    margin-bottom: 4px;
  }
  .settings input {
    width: 100%;
    box-sizing: border-box;
    padding: 6px 8px;
    font-size: 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    margin-bottom: 6px;
  }
  .settings .save {
    width: auto;
    padding: 4px 10px;
    font-size: 11px;
    background: #444;
  }
  .settings .save:hover { background: #222; }
  #keyStatus {
    font-size: 10px;
    color: #888;
    margin-top: 4px;
  }
</style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="Fake Form Filler logo" />
    <h1>Fake Form Filler</h1>
  </div>
  <button id="fillBtn">Fill the form</button>
  <div id="status"></div>
  <div class="hint">Fills recognized fields with consistent dummy data. The email field gets a real, receivable SimpleLogin alias instead of a fake address.</div>

  <div class="settings">
    <label for="apiKey">SimpleLogin API key</label>
    <input type="password" id="apiKey" placeholder="sl_xxxxxxxxxxxxx" autocomplete="off" />
    <button class="save" id="saveKeyBtn">Save key</button>
    <div id="keyStatus"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
